<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: linear-gradient(180deg, #fdd5e0, #fbc8d4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            color: #fff;
            font-size: 22px;
            animation: twinkle 2s infinite alternate;
            text-shadow: 0 0 8px #fff;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.1); }
        }
        .calculator {
            background: #fff0f5;
            padding: 25px;
            border-radius: 30px;
            border: 4px solid #c2185b;
            box-shadow: 0 10px 35px rgba(194, 24, 91, 0.25);
            z-index: 10;
            width: 380px;
        }
        #display {
            width: 100%;
            height: 100px;
            font-size: 36px;
            text-align: right;
            padding: 20px;
            margin-bottom: 25px;
            border: 3px solid #c2185b;
            background: #fff;
            color: #ad1457;
            border-radius: 12px;
            pointer-events: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        button {
            height: 75px;
            font-size: 24px;
            font-weight: 600;
            border: 2px solid #c2185b;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button:active {
            transform: scale(0.95);
        }
        button.top {
            background: #f8c8dc;
            color: #ad1457;
        }
        button.top:hover {
            background: #f48fb1;
        }
        button.operator {
            background: #f8c8dc;
            color: #ad1457;
        }
        button.operator:hover {
            background: #f48fb1;
        }
        button.number {
            background: #fff;
            color: #ad1457;
        }
        button.number:hover {
            background: #fce4ec;
        }
        button.equal {
            background: #f48fb1;
            color: #ad1457;
        }
        button.equal:hover {
            background: #ec407a;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="calculator">
        <input type="text" id="display" readonly value="0">
        
        <div class="buttons">
            <button class="top" onclick="clearDisplay()">AC</button>
            <button class="top" onclick="appendValue('%')">%</button>
            <button class="top" onclick="backspace()">⌫</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button class="number" onclick="appendValue('7')">7</button>
            <button class="number" onclick="appendValue('8')">8</button>
            <button class="number" onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button class="number" onclick="appendValue('4')">4</button>
            <button class="number" onclick="appendValue('5')">5</button>
            <button class="number" onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button class="number" onclick="appendValue('1')">1</button>
            <button class="number" onclick="appendValue('2')">2</button>
            <button class="number" onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="number" onclick="appendValue('00')">00</button>
            <button class="number" onclick="appendValue('0')">0</button>
            <button class="number" onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const starsContainer = document.getElementById('stars');
        const starCount = 40;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('span');
            star.className = 'star';
            star.innerHTML = '★';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            star.style.fontSize = (Math.random() * 16 + 12) + 'px';
            starsContainer.appendChild(star);
        }

        function appendValue(val) {
            let display = document.getElementById('display');
            if (display.value === '0' && val !== '.') {
                display.value = val;
            } else {
                display.value += val;
            }
        }

        function clearDisplay() {
            document.getElementById('display').value = '0';
        }

        function backspace() {
            let display = document.getElementById('display');
            display.value = display.value.slice(0, -1);
            if (display.value === '') display.value = '0';
        }

        function calculate() {
            let display = document.getElementById('display');
            try {
                let expr = display.value.replace(/%/g, '/100');
                let result = eval(expr);
                display.value = Number.isInteger(result) ? result : result.toFixed(2);
            } catch {
                display.value = 'Error';
                setTimeout(() => display.value = '0', 1500);
            }
        }
    </script>
</body>
</html>
